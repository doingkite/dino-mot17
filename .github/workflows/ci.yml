name: CPU checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m compileall -q mot17_dinov3_point_match.py mot17_annotate_pairs.py mot17_dinov3_batch.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
